name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle
        run: chmod +x bigeyes-app/gradlew

      - name: Build Release APK
        run: |
          cd bigeyes-app
          ./gradlew assembleRelease --stacktrace

      - name: Print Test Failures if any
        if: failure()
        run: |
          find bigeyes-app -name "*.txt" -path "*/reports/tests/*" -exec cat {} + || true

      - name: Prepare Release Asset
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v2.0.3}"
          mkdir -p release-artifacts
          cp bigeyes-app/app/build/outputs/apk/release/app-release.apk release-artifacts/BigEyes-${TAG_NAME}.apk
          echo "Release APK generated at release-artifacts/BigEyes-${TAG_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: BigEyes Release ${{ github.ref_name }}
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
