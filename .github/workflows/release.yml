name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle
        run: chmod +x bigeyes-app/gradlew

      - name: Build Release APK
        run: |
          cd bigeyes-app
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Print Test and Build Failures if any
        if: failure()
        run: |
          echo "=== GRADLE BUILD LOG (LAST 200 LINES) ==="
          tail -n 200 bigeyes-app/gradle-build.log || true
          find bigeyes-app -type f \( -name "*.txt" -o -name "*.log" -o -name "*.xml" \) -path "*/build/reports/*" -exec echo "=== {} ===" \; -exec cat {} + || true

      - name: Prepare Release Asset
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v2.0.23}"
          mkdir -p release-artifacts
          echo "Searching for generated APKs in bigeyes-app:"
          find bigeyes-app -name "*.apk"
          APK_FILE=""
          for f in $(find bigeyes-app -name "*.apk"); do
            if [ -f "$f" ]; then
              APK_FILE="$f"
              break
            fi
          done
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK generated by Gradle build!"
            exit 1
          fi
          cp "$APK_FILE" "release-artifacts/BigEyes-${TAG_NAME}.apk"
          ls -la release-artifacts/
          echo "Release APK prepared at release-artifacts/BigEyes-${TAG_NAME}.apk from $APK_FILE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: BigEyes Release ${{ github.ref_name }}
          files: release-artifacts/BigEyes-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
