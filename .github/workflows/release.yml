name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle
        run: chmod +x bigeyes-app/gradlew

      - name: Build Release APK
        run: |
          cd bigeyes-app
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Print Test and Build Failures if any
        if: failure()
        run: |
          echo "=== GRADLE BUILD LOG (LAST 200 LINES) ==="
          tail -n 200 bigeyes-app/gradle-build.log || true
          find bigeyes-app -type f \( -name "*.txt" -o -name "*.log" -o -name "*.xml" \) -path "*/build/reports/*" -exec echo "=== {} ===" \; -exec cat {} + || true

      - name: Prepare Release Asset
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v2.0.21}"
          mkdir -p release-artifacts
          for apk in $(find bigeyes-app -name "*.apk"); do
            cp "$apk" "release-artifacts/BigEyes-${TAG_NAME}.apk"
            echo "Copied $apk to release-artifacts/BigEyes-${TAG_NAME}.apk"
            break
          done
          ls -la release-artifacts/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create ${{ github.ref_name }} release-artifacts/*.apk --title "BigEyes Release ${{ github.ref_name }}" --generate-notes || gh release upload ${{ github.ref_name }} release-artifacts/*.apk --clobber
