name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle
        run: chmod +x bigeyes-app/gradlew

      - name: Build Release APK
        run: |
          cd bigeyes-app
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Print Test and Build Failures if any
        if: failure()
        run: |
          find bigeyes-app -type f \( -name "*.txt" -o -name "*.log" -o -name "*.xml" \) -path "*/build/reports/*" -exec echo "=== {} ===" \; -exec cat {} + || true

      - name: Prepare Release Asset
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v2.0.23}"
          mkdir -p release-artifacts
          for f in bigeyes-app/app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then
              cp "$f" "release-artifacts/BigEyes-${TAG_NAME}.apk"
              echo "Copied $f to release-artifacts/BigEyes-${TAG_NAME}.apk"
              break
            fi
          done
          ls -la release-artifacts/
          if [ ! -f "release-artifacts/BigEyes-${TAG_NAME}.apk" ]; then
            echo "ERROR: BigEyes-${TAG_NAME}.apk not found in release-artifacts!"
            exit 1
          fi
          echo "Release APK generated at release-artifacts/BigEyes-${TAG_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: BigEyes Release ${{ github.ref_name }}
          files: release-artifacts/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
