name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle
        run: chmod +x bigeyes-app/gradlew

      - name: Build Release APK
        run: |
          cd bigeyes-app
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Print Test and Build Failures if any
        if: failure()
        run: |
          echo "=== GRADLE BUILD LOG (LAST 200 LINES) ==="
          tail -n 200 bigeyes-app/gradle-build.log || true
          find bigeyes-app -type f \( -name "*.txt" -o -name "*.log" -o -name "*.xml" \) -path "*/build/reports/*" -exec echo "=== {} ===" \; -exec cat {} + || true

      - name: Prepare Release Asset
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v2.0.21}"
          mkdir -p release-artifacts
          APK_FILE=$(find bigeyes-app/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "release-artifacts/BigEyes-${TAG_NAME}.apk"
            echo "Release APK generated at release-artifacts/BigEyes-${TAG_NAME}.apk from $APK_FILE"
          else
            echo "No release APK found!"
            find bigeyes-app/app/build/outputs -type f || true
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: BigEyes Release ${{ github.ref_name }}
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
